# Minimal SearXNG config for Crew: JSON API on, rate limiter off (only reachable inside the Docker network).
use_default_settings: true
general:
  instance_name: "Crew search"
server:
  secret_key: "change-me-via-SEARXNG_SECRET"
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 0
  formats:
    - html
    - json
