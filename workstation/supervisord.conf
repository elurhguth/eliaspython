[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=/usr/bin/fluxbox
user=crew
environment=HOME="/home/crew",DISPLAY=":99"
priority=15
autorestart=true
startsecs=2
stdout_logfile=/dev/null
redirect_stderr=true

[program:chromium]
command=/usr/local/bin/start-chromium.sh
user=crew
environment=HOME="/home/crew",DISPLAY=":99"
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/null
redirect_stderr=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet -noxdamage
priority=30
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:toold]
command=/usr/bin/env node /opt/toold/dist/index.js
user=crew
directory=/home/crew
environment=HOME="/home/crew"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
